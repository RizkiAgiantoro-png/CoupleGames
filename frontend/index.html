<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ikkidine's Game, a private romantic multiplayer game for Rizki and Nadine."
    />
    <title>Ikkidine's Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/animations.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="game-actions" aria-label="Game controls">
      <button class="game-action-btn" type="button" data-action="restart" title="Restart game">
        Restart
      </button>
      <button class="game-action-btn game-action-btn--home" type="button" data-action="home" title="Back to home">
        Home
      </button>
    </div>

    <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <p class="modal-title" id="modal-title"></p>
        <p class="modal-message"></p>
        <div class="modal-actions">
          <button class="modal-cancel" type="button">Cancel</button>
          <button class="modal-confirm" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <main class="app-shell">
      <section class="hero-panel" aria-labelledby="home-title">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">IG</div>
          <div>
            <p class="eyebrow">Private game for two</p>
            <p class="brand-name">Rizki & Nadine</p>
          </div>
        </div>

        <div class="menu-content">
          <p class="kicker">Ikkidine's Game</p>
          <h1 id="home-title">Choose Your Game</h1>
          <p class="hero-copy">
            Pick one of the three little love tests and play together in sync.
          </p>

          <div class="status-card" role="status">
            <div class="status-orbit" aria-hidden="true">
              <span></span>
            </div>
            <div>
              <p class="status-label">Waiting for connection</p>
              <p class="status-text">
                Open this page twice to connect Rizki and Nadine, then choose
                any game to play together.
              </p>
            </div>
          </div>

          <div class="game-menu" aria-label="Choose a game">
            <button class="game-option" type="button" data-game="knowEachOther">
              <span class="preview-icon" aria-hidden="true">01</span>
              <span>
                <strong>Know Each Other</strong>
                <small>Guess what your partner selected.</small>
              </span>
            </button>
            <button class="game-option" type="button" data-game="thisOrThat">
              <span class="preview-icon" aria-hidden="true">02</span>
              <span>
                <strong>This or That</strong>
                <small>Choose together and compare tastes.</small>
              </span>
            </button>
            <button class="game-option" type="button" data-game="guessMyAnswer">
              <span class="preview-icon" aria-hidden="true">03</span>
              <span>
                <strong>Guess My Answer</strong>
                <small>Type, guess, reveal, and score closeness.</small>
              </span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
